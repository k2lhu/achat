# achat config, normally written for you by the setup in achat (/provider add).
# To edit by hand, copy to ~/.config/achat/config.toml.
#
# type is "openai" (default; any OpenAI-compatible API), "anthropic", "venice" (OpenAI-compatible,
# plus balance and limits in the status bar) or "featherless" (OpenAI-compatible, plus plan and
# concurrency units).
#
# api_key can be:
#   "keychain:NAME"  read from your OS keyring (recommended): the macOS Keychain, or on Linux
#                    the Secret Service keyring via secret-tool. Add a key by hand with:
#                      macOS: security add-generic-password -s achat -a NAME -w
#                      Linux: secret-tool store --label="achat: NAME" service achat account NAME
#                    (you're prompted for the key, so it never lands in shell history)
#   "env:VAR"        read from an environment variable, e.g. "env:ACHAT_OPENAI_API_KEY"
#   omitted          no auth, for local servers
#   anything else    the key itself, in plain text (works, but not recommended)
#
# Model names change often: run /models inside achat to see what a provider offers.

default = "openai"

# Markdown renderer: "new" (default) or "classic" (the original marked-terminal look).
# Switch during a session with /renderer. Top-level settings must come before [providers].
# renderer = "classic"

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key = "keychain:openai"
model = "gpt-5-mini"
# system_prompt = "You are a concise assistant."
# Prices for the cost shown in the status bar, in USD per million tokens [input, output].
# Only needed where the API doesn't report them (Anthropic, OpenRouter and Venice do).
# prices = { "gpt-5-mini" = [0.25, 2.0] }

[providers.ollama]
base_url = "http://localhost:11434/v1"
model = "llama3.2"

[providers.anthropic]
type = "anthropic"
base_url = "https://api.anthropic.com"
api_key = "keychain:anthropic"
model = "claude-opus-5-5"


name: Bug report
description: Something doesn't work as expected
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key.** If you include your config, remove any `api_key` that holds a literal key.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `achat --version`
      render: text
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: e.g. OpenRouter, openai/gpt-5-mini
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: e.g. iTerm2, Ghostty, GNOME Terminal

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # Installs the packed tarball the way users install from npm, then runs it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dev-only install scripts (esbuild) aren't needed; users' installs have none.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Pack and install globally
        run: |
          npm pack
          npm install -g ./k2lhu-achat-*.tgz
      - run: achat --version
      - run: achat --help
      - name: Key storage (macOS Keychain)
        if: runner.os == 'macOS'
        run: npx tsx scripts/keystore-check.ts
      - name: Key storage (Linux without a keyring falls back to env keys)
        if: runner.os == 'Linux'
        run: env -u DBUS_SESSION_BUS_ADDRESS npx tsx scripts/keystore-check.ts
        env:
          EXPECT_NO_KEYRING: '1'

  # Stores, reads and deletes a key through secret-tool with a real keyring.
  linux-keyring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Dev-only install scripts (esbuild) aren't needed; users' installs have none.
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus
      - name: Round trip through secret-tool
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            echo -n ci-password | gnome-keyring-daemon --unlock --components=secrets --replace --daemonize
            sleep 1
            npx tsx scripts/keystore-check.ts
          '
